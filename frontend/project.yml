name: HAL
options:
  bundleIdPrefix: com.hal9000
targets:
  HAL:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AppCoordinator.swift
      - AppState.swift
      - AudioManager.swift
      - ContentView.swift
      - HALApp.swift
      - PermissionsManager.swift
      - WakeWordManager.swift
      - WebSocketManager.swift
    settings:
      base:
        DEVELOPMENT_TEAM: BSGY6N2M8X
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "HAL needs microphone access for wake word detection and voice interaction."
        INFOPLIST_KEY_NSCameraUsageDescription: "HAL needs camera access for vision interaction."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "HAL needs speech recognition access to detect the wake word 'HAL'."
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
