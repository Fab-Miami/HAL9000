<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>HAL 9000</title>
  <meta name="apple-mobile-web-app-title" content="HAL" />
  <meta name="application-name" content="HAL" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <link rel="manifest" href="/manifest.json?v=2026.10.17.4" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=3" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png?v=3" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png?v=3" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=3" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Transparent Interaction Layer (Forces iOS Safari to register tap and unlock AudioContext) -->
    <div id="init-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99999; cursor:pointer; -webkit-tap-highlight-color:transparent;"></div>
    
    <!-- Main Optical Faceplate (Centered behind 3D printed bezel) -->
    <div id="hal-stage">
      <div id="hal-container">
        <!-- HAL 2026 3D Multi-Layer Optical Assembly -->
        <div id="hal-2026-assembly">
          <img id="layer-everything-off" class="hal2026-layer" src="/hal2026/hal2026_everything_off.png" alt="" draggable="false" />
          <img id="layer-3-led-on" class="hal2026-layer" src="/hal2026/hal2026_3_led_on.png" alt="" draggable="false" />
          <img id="layer-center-on" class="hal2026-layer" src="/hal2026/hal2026_center_on.png" alt="" draggable="false" />
          <img id="layer-ring-on" class="hal2026-layer" src="/hal2026/hal2026_ring_on.png" alt="" draggable="false" />
        </div>
      </div>
    </div>

    <!-- Real-Time Knock & Acceleration Sensor Monitor HUD -->
    <div id="knock-hud">
      <div class="knock-hud-header">
        <span class="hud-title">⚡ KNOCK SENSOR MONITOR</span>
        <span id="hud-status" class="hud-status">STANDBY</span>
      </div>
      
      <div class="knock-hud-meters">
        <div class="meter-box">
          <div class="meter-label">CURRENT SHOCK</div>
          <div id="hud-current" class="meter-val">0.00 <span class="unit">m/s²</span></div>
        </div>
        <div class="meter-box highlight">
          <div class="meter-label">PEAK REGISTERED</div>
          <div id="hud-peak" class="meter-val">0.00 <span class="unit">m/s²</span></div>
        </div>
        <div class="meter-box">
          <div class="meter-label">THRESHOLD</div>
          <div id="hud-thresh" class="meter-val">0.35 <span class="unit">m/s²</span></div>
        </div>
      </div>

      <!-- Real-time Shock VU Level Meter -->
      <div class="knock-vu-container">
        <div class="knock-vu-track">
          <div id="knock-vu-fill" class="knock-vu-fill"></div>
          <div id="knock-vu-thresh-mark" class="knock-vu-thresh-mark"></div>
        </div>
      </div>

      <div class="knock-hud-details">
        <span id="hud-breakdown">Lin: 0.00 | Jerk: 0.00</span>
        <span id="hud-event-count">Events: 0</span>
      </div>

      <div class="knock-hud-controls">
        <button id="btn-reset-peak" class="hud-btn" type="button">RESET PEAK</button>
        <button id="btn-toggle-sleep" class="hud-btn" type="button">SLEEP NOW</button>
        <div class="thresh-presets">
          <span class="preset-label">THRESH:</span>
          <button class="thresh-btn" data-thresh="0.15" type="button">0.15</button>
          <button class="thresh-btn" data-thresh="0.25" type="button">0.25</button>
          <button class="thresh-btn active" data-thresh="0.35" type="button">0.35</button>
          <button class="thresh-btn" data-thresh="0.50" type="button">0.50</button>
          <button class="thresh-btn" data-thresh="0.75" type="button">0.75</button>
          <button class="thresh-btn" data-thresh="1.25" type="button">1.25</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
