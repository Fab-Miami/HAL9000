<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>HAL 9000</title>
  <meta name="apple-mobile-web-app-title" content="HAL" />
  <meta name="application-name" content="HAL" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <link rel="manifest" href="/manifest.json?v=2026.10.17.4" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=3" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png?v=3" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png?v=3" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=3" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Transparent Interaction Layer (Forces iOS Safari to register tap and unlock AudioContext) -->
    <div id="init-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99999; cursor:pointer; -webkit-tap-highlight-color:transparent;"></div>
    
    <!-- Main Optical Faceplate (Centered behind 3D printed bezel) -->
    <div id="hal-stage">
      <div id="hal-container">
        <!-- HAL 2026 3D Multi-Layer Optical Assembly -->
        <div id="hal-2026-assembly">
          <img id="layer-chassis" class="hal2026-layer" src="/hal2026/hal2026_chassis_base.png" alt="" draggable="false" />
          <img id="layer-ring" class="hal2026-layer" src="/hal2026/hal2026_acoustic_ring.png" alt="" draggable="false" />
          <img id="layer-center" class="hal2026-layer" src="/hal2026/hal2026_center_core.png" alt="" draggable="false" />
          <img id="layer-dots" class="hal2026-layer" src="/hal2026/hal2026_aux_dots.png" alt="" draggable="false" />
          <img id="layer-mask" class="hal2026-layer" src="/hal2026/hal2026_outer_mask.png" alt="" draggable="false" />
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
